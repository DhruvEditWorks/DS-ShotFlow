name: Import DS ShotFlow Source

on:
  push:
    paths:
      - ".github/workflows/import-shotflow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 "https://sentences-cognitive-interests-lifetime.trycloudflare.com/ds-shotflow.tar.gz" -o /tmp/ds-shotflow.tar.gz
          echo "0f844b9f0165ac2ae1231b0a73ef8585a5c7ed8b383d3ac4a919df955190e6ab  /tmp/ds-shotflow.tar.gz" | sha256sum -c -

      - name: Replace repository contents with DS ShotFlow app
        run: |
          set -euo pipefail
          mkdir -p /tmp/ds-shotflow-src
          tar -xzf /tmp/ds-shotflow.tar.gz -C /tmp/ds-shotflow-src
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ds-shotflow-src/. .
          git status --short

      - name: Commit imported app
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload DS ShotFlow app" || exit 0
          git push
